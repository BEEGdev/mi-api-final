openapi: 3.0.0
info:
  title: Mi API REST - Módulo 7
  description: API REST con autenticación JWT y MongoDB
  version: 1.0.0

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

paths:
  /api/v1/hello:
    get:
      summary: Saludo básico
      description: Devuelve un mensaje de Hola Mundo
      responses:
        200:
          description: Éxito
          
  /api/v1/saludo/{nombre}:
    get:
      summary: Saludo personalizado
      parameters:
        - in: path
          name: nombre
          required: true
          schema:
            type: string
      responses:
        200:
          description: Éxito
          
  /api/v1/login/registro:
    post:
      summary: Registrar nuevo usuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nombre:
                  type: string
                email:
                  type: string
                password:
                  type: string
      responses:
        201:
          description: Usuario creado
          
  /api/v1/login:
    post:
      summary: Iniciar sesión
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        200:
          description: Login exitoso
          
  /api/v1/usuarios:
    get:
      summary: Obtener lista de usuarios
      security:
        - bearerAuth: []
      responses:
        200:
          description: Éxito
        401:
          description: No autorizado